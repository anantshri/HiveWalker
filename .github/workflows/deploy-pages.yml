name: deploy-pages

# Release-based GitHub Pages deployment: publishes the app when a v* tag is
# pushed. The app is a static site (no build step), so deployment is a copy
# of the working tree plus the decompressed-fixture note.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; superseded runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          # The app root is the site root: index.html, favicon, src/, docs/logo
          cp index.html favicon.svg LICENSE README.md _site/
          cp -r src _site/src
          mkdir -p _site/docs
          cp docs/logo.svg _site/docs/logo.svg

      - name: Cache-bust local assets
        run: |
          set -euo pipefail
          # Append ?v=<content-hash> to every locally-referenced asset so a new
          # release never lets a browser blend cached-old with fetched-new files
          # (the class of bug that once produced a blank PDF export).
          node scripts/stamp-cache-bust.js _site

      - name: Check the app is self-contained
        run: |
          set -euo pipefail
          # every local asset referenced by the deployed pages must be present
          # (strip the ?v=… cache-busting query before resolving to a file)
          grep -oE '(src|href)="[^"#]+"' _site/index.html \
            | sed -E 's/^(src|href)="//; s/"$//; s/\?.*$//' \
            | grep -v -E '^https?://' \
            | while read -r f; do
                test -f "_site/$f" || { echo "MISSING from site: $f"; exit 1; }
              done
          echo "site is self-contained"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
