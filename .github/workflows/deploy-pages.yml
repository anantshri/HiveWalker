name: deploy-pages

# Release-based GitHub Pages deployment: publishes the app when a v* tag is
# pushed. The app is a static site (no build step), so deployment is a copy
# of the working tree plus the decompressed-fixture note.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; superseded runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          # The app root is the site root: index.html, favicon, src/, docs/logo
          cp index.html favicon.svg LICENSE README.md _site/
          cp -r src _site/src
          mkdir -p _site/docs
          cp docs/logo.svg _site/docs/logo.svg

      - name: Check the app is self-contained
        run: |
          set -euo pipefail
          # every local asset referenced by the deployed pages must be present
          grep -oE '(src|href)="[^"#]+"' _site/index.html \
            | sed -E 's/^(src|href)="//; s/"$//' \
            | grep -v -E '^https?://' \
            | while read -r f; do
                test -f "_site/$f" || { echo "MISSING from site: $f"; exit 1; }
              done
          echo "site is self-contained"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
