<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HiveWalker — Windows Registry Hive Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Open Windows registry hive files (SAM, SYSTEM, SOFTWARE, SECURITY, NTUSER.DAT, UsrClass.dat) entirely in your browser. No upload, no server, no install.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="app" data-state="empty">
  <header id="topbar">
    <span id="brand"><img src="favicon.svg" alt="" width="18" height="18" class="brand-logo"> HiveWalker</span>
    <label id="open-btn" for="file-input">Open hive…</label>
    <input id="file-input" type="file" hidden>
    <span id="file-name" title=""></span>
    <input id="search-input" type="search" placeholder="Search keys, value names, data…"
           autocomplete="off" spellcheck="false" disabled>
    <button id="meta-btn" type="button" hidden>Hive info</button>
  </header>

  <main id="panes">
    <div id="welcome" class="card">
      <img src="docs/logo.svg" alt="HiveWalker" width="72" height="72" class="welcome-logo">
      <h1>HiveWalker</h1>
      <p>Drop a registry hive file anywhere on this page, or use <strong>Open hive…</strong></p>
      <p>Suitable files: <code>SAM</code> · <code>SYSTEM</code> · <code>SOFTWARE</code> ·
         <code>SECURITY</code> · <code>NTUSER.DAT</code> · <code>UsrClass.dat</code></p>
      <p class="muted">Everything is parsed locally in your browser. Nothing is uploaded.</p>
    </div>
    <div id="error-card" class="card error" hidden></div>

    <nav id="tree-pane" aria-label="Registry keys" hidden></nav>
    <section id="values-pane" hidden></section>
  </main>

  <div id="search-results" hidden></div>

  <aside id="meta-pane" hidden></aside>
  <div id="hex-pane" hidden></div>

  <footer id="statusbar" hidden></footer>
</div>

<!-- Single global namespace; classic scripts in dependency order. -->
<script>window.RV = { reg: {}, ui: {} };</script>
<script src="src/reg/00-const.js"></script>
<script src="src/reg/01-buffer-reader.js"></script>
<script src="src/reg/02-filetime.js"></script>
<script src="src/reg/03-utf16.js"></script>
<script src="src/reg/04-regf-block.js"></script>
<script src="src/reg/05-hbin.js"></script>
<script src="src/reg/06-nk.js"></script>
<script src="src/reg/07-vk.js"></script>
<script src="src/reg/08-sk.js"></script>
<script src="src/reg/09-subkey-list.js"></script>
<script src="src/reg/10-value-list.js"></script>
<script src="src/reg/11-value-data.js"></script>
<script src="src/reg/12-hive.js"></script>
<script src="src/reg/13-index.js"></script>
<script src="src/ui/20-view-model.js"></script>
<script src="src/ui/21-app.js"></script>
<script src="src/ui/22-tree.js"></script>
<script src="src/ui/23-values.js"></script>
<script src="src/ui/24-hexview.js"></script>
<script src="src/ui/25-search.js"></script>
<script src="src/ui/26-hivemeta.js"></script>
<script src="src/ui/27-statusbar.js"></script>
<script src="src/ui/28-resizer.js"></script>
<script src="src/main.js"></script>
</body>
</html>
